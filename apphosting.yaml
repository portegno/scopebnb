runConfig:
  cpu: 1
  memoryMiB: 512
  concurrency: 80
  minInstances: 0
  maxInstances: 10

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyB2_bWFjvM3eBrOCdmINRONo8fNNt4leh0
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: scopebnb.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: scopebnb
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: scopebnb.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "545100308806"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:545100308806:web:49692d66e4a1be12470547
    availability:
      - BUILD
      - RUNTIME

  - variable: GEMINI_MODEL
    value: gemini-2.5-flash-lite
    availability:
      - BUILD
      - RUNTIME
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME

  # Shared secret for the on-site N.I.N.A. -> /api/sessions/ingest uploader.
  - variable: SESSION_INGEST_SECRET
    secret: SESSION_INGEST_SECRET
    availability:
      - RUNTIME

  # Comma-separated super-admin Google account emails (not a secret). Super
  # admins always have ALL permissions and can manage the team & bundles; they
  # can't be locked out. Everyone else gets access via the adminUsers collection.
  - variable: SUPER_ADMIN_EMAILS
    value: gabriel@pulpou.com
    availability:
      - RUNTIME
